<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精选导航</title>
<style>
:root {
  color-scheme: dark;
  --bg: #140d1b;
  --card: #241629;
  --border: #4c2b4c;
  --text: #fffaf2;
  --sub: #e0d8e5;
  --accent: #ffe6ad;
  --accent-strong: #fff7eb;
  --highlight: #ffe082;
  --soft: #39203d;
  --border-accent: #a9517e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #32162e, var(--bg) 480px);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.container { max-width: 1200px; margin: 0 auto; padding: 12px; }

.notice {
  background: linear-gradient(90deg, #382039, #27172f);
  border: 1px solid var(--border);
  color: var(--accent-strong);
  text-align: center;
  padding: 8px 12px;
  font-size: 13px;
  border-radius: 6px;
  margin-bottom: 16px;
}

.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 22px; letter-spacing: 1px; color: var(--accent-strong); }
.header p { color: var(--sub); font-size: 12px; }

.section-title {
  font-size: 15px;
  font-weight: 600;
  margin: 16px 0 8px;
  color: var(--accent);
}

/* 主推：一行1个 */
.main-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.main-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--accent-strong);
  text-align: center;
  padding: 14px 8px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  display: block;
}
/* 重点推荐：酒红紫底色搭配亮金色文字，增强明暗与色相对比 */
.main-btn.highlight {
  border: 1px solid var(--border-accent);
  background: linear-gradient(180deg, #49223a, #2c1830);
  box-shadow: 0 3px 16px rgba(217, 63, 139, 0.18);
  color: var(--highlight);
}

/* 次推：一行2个 */
.sub-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.sub-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--accent-strong);
  text-align: center;
  padding: 12px 6px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  display: block;
}

/* 其他：紧凑 */
.other-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.other-btn {
  background: #1e1325;
  border: 1px solid var(--border);
  color: var(--accent-strong);
  text-align: center;
  padding: 8px 4px;
  border-radius: 5px;
  text-decoration: none;
  font-size: 12px;
  display: block;
}

.main-btn:hover, .sub-btn:hover, .other-btn:hover {
  background: var(--soft);
  border-color: var(--border-accent);
}
.main-btn:focus-visible, .sub-btn:focus-visible, .other-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* 白色文案按钮：柔光、扫光和角落星芒 */
.bling {
  --bling-delay: 0s;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  animation: bling-glow 4.8s ease-in-out infinite;
  animation-delay: var(--bling-delay);
}
.bling:nth-child(3n + 2) { --bling-delay: -1.6s; }
.bling:nth-child(3n) { --bling-delay: -3.2s; }
.bling::before, .bling::after {
  content: "";
  position: absolute;
  pointer-events: none;
  animation-delay: var(--bling-delay);
}
.bling::before {
  inset: 0;
  z-index: -1;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.05) 43%, rgba(255, 240, 252, 0.16) 50%, transparent 65%);
  transform: translateX(-110%);
  animation: bling-sweep 4.8s ease-in-out infinite;
  animation-delay: var(--bling-delay);
}
.bling::after {
  top: 5px;
  right: 7px;
  width: 9px;
  height: 9px;
  background: #fff6dd;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  opacity: 0;
  animation: bling-sparkle 4.8s ease-in-out infinite;
  animation-delay: var(--bling-delay);
}
@keyframes bling-glow {
  0%, 100% { text-shadow: 0 0 2px rgba(255, 247, 235, 0.15); }
  45%, 55% { text-shadow: 0 0 5px rgba(255, 247, 235, 0.5), 0 0 12px rgba(243, 168, 221, 0.3); }
}
@keyframes bling-sweep {
  0%, 15% { transform: translateX(-110%); }
  55%, 100% { transform: translateX(110%); }
}
@keyframes bling-sparkle {
  0%, 25%, 75%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
  50% { opacity: 0.95; transform: scale(1) rotate(90deg); }
}
@media (prefers-reduced-motion: reduce) {
  .bling { animation: none; text-shadow: none; }
  .bling::before, .bling::after { animation: none; display: none; }
}

/* 电脑端适配 */
@media (min-width: 768px) {
  .main-grid { grid-template-columns: repeat(2, 1fr); }
  .sub-grid { grid-template-columns: repeat(4, 1fr); }
  .other-grid { grid-template-columns: repeat(5, 1fr); }
  .container { padding: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="notice">公告：部分应用需科学上网使用，请注意辨别真伪，谨防钓鱼链接</div>

  <div class="header">
    <h1>精选导航</h1>
    <p>优质资源推荐</p>
  </div>

  <div class="section-title">主推</div>
  <div class="main-grid" id="main"></div>

  <div class="section-title">次推</div>
  <div class="sub-grid" id="sub"></div>

  <div class="section-title">其他推荐</div>
  <div class="other-grid" id="other"></div>
</div>

<script>
const products = [
  // 主推（5个）- 第2、3个高亮（亮金色字体）
  { tier: 1, name: "🔥 黄果AI短剧 🔥", url: "https://d3g7538xrewa51.cloudfront.net?dc=hgs004202", highlight: true },
  { tier: 1, name: "🔥黄果漫剧🔥", url: "https://d2xunosqqsurps.cloudfront.net?dc=hgs004202", highlight: true },
  { tier: 1, name: "各种十几岁妹子的违禁视频，推特都不能发", url: "https://5kx8c.com" },
  { tier: 1, name: "想看人与🐶、小马拉大车的视频点这里", url: "https://3a5zh.com" },

  // 次推（6个）
  { tier: 2, name: "黄果漫剧", url: "https://d2xunosqqsurps.cloudfront.net?dc=hgs004202" },
  { tier: 2, name: "另一版黄果", url: "https://3z9fk.com" },
  { tier: 2, name: "91大神", url: "https://3f5rw.com" },
  { tier: 2, name: "成人快手", url: "https://5kx8c.com" },

  // 其他（5个）
  { tier: 3, name: "电报资源", url: "https://t.me/kuai?start=a_3YQ0IF7" },
];

function render() {
  const main = document.getElementById("main");
  const sub = document.getElementById("sub");
  const other = document.getElementById("other");

  products.forEach(p => {
    if (p.tier === 1) {
      const cls = p.highlight ? "main-btn highlight" : "main-btn bling";
      main.innerHTML += `<a class="${cls}" href="${p.url}" target="_blank">${p.name}</a>`;
    } else if (p.tier === 2) {
      sub.innerHTML += `<a class="sub-btn bling" href="${p.url}" target="_blank">${p.name}</a>`;
    } else {
      other.innerHTML += `<a class="other-btn bling" href="${p.url}" target="_blank">${p.name}</a>`;
    }
  });
}
render();
</script>
</body>
</html>
