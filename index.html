<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精品资源收藏保存</title>
  <link rel="preload" as="image" href="./imgs/bg-mobile.webp" type="image/webp" media="(max-width: 600px)" fetchpriority="high">
  <link rel="preload" as="image" href="./imgs/bg-optimized.webp" type="image/webp" media="(min-width: 601px)" fetchpriority="high">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-color: #173749;
      background-image: linear-gradient(rgba(0, 0, 0, 0.349), rgba(0, 0, 0, 0.349)), url('./imgs/bg.jpeg');
      background-image: linear-gradient(rgba(0, 0, 0, 0.349), rgba(0, 0, 0, 0.349)), image-set(url('./imgs/bg-optimized.webp') type('image/webp'), url('./imgs/bg.jpeg') type('image/jpeg'));
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (max-width: 600px) {
      .container {
        background-image: linear-gradient(rgba(0, 0, 0, 0.349), rgba(0, 0, 0, 0.349)), image-set(url('./imgs/bg-mobile.webp') type('image/webp'), url('./imgs/bg.jpeg') type('image/jpeg'));
      }
    }

    .top-section {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      display: block;
      width: 90px;
      height: 90px;
      border-radius: 15px;
    }

    .title-large {
      font-size: 24px;
      font-weight: bold;
      color: white;
      margin-top: 10px;
      text-align: center;
    }

    .title-small {
      font-size: 16px;
      color: rgb(226, 223, 223);
      margin-top: 5px;
      text-align: center;
    }

    .middle-section {
      margin-top: 20px;
      width: 90%;
      max-width: 400px;
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 12px;
      background-color: #26a5e4;
      padding: 11px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }

    /* 静态渐变只绘制一次；交互时通过 transform 旋转独立图层。 */
    .card::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150%;
      aspect-ratio: 1;
      background: conic-gradient(#ff0000, #ffdd00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -2;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 9px;
      background: #d3d3d3;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes rainbow-border-spin {
      to {
        transform: translate(-50%, -50%) rotate(1turn);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card-link:focus-visible .card::before {
        animation: rainbow-border-spin 3s linear infinite;
      }
    }

    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      .card-link:hover .card::before {
        animation: rainbow-border-spin 3s linear infinite;
      }
    }

    .card-link {
      text-decoration: none;
      color: inherit;
    }

    .card-link:last-child .card {
      margin-bottom: 0;
    }

    .card-text {
      flex-grow: 1;
      margin-left: 15px;
      margin-right: 15px;
      font-size: 16px;
    }

    .card-arrow {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 8px solid #555;
    }

    .telegram-resource {
      margin-top: 32px;
      margin-bottom: 40px;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: rgba(255, 255, 255, 0.9);
      color: #333;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
    }

    .link-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    #bookmark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      /* Initially hidden */
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }

    .bookmark-popup {
      box-sizing: border-box;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      width: 90%;
      max-width: 350px;
      cursor: default;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      text-align: left;
    }

    .bookmark-header {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

    .bookmark-content p {
      margin: 10px 0;
      line-height: 1.6;
    }

    .bookmark-content .inline-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin: 0 5px;
      vertical-align: middle;
    }

    .bookmark-content hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 15px 0;
    }

    .bookmark-footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
  <script>
    function bookmarkPage() {
      // Simple check for mobile devices based on user agent
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      if (isMobile) {
        // On mobile, show the guide overlay
        const overlay = document.getElementById('bookmark-overlay');
        if (overlay) {
          overlay.style.display = 'flex';
        }
      } else {
        // On PC, show the keyboard shortcut alert
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        const shortcut = isMac ? 'Cmd/⌘ + D' : 'Ctrl + D';
        alert('按下 ' + shortcut + ' 收藏本页');
      }
    }

    function hideBookmarkOverlay() {
      const overlay = document.getElementById('bookmark-overlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
    }
  </script>
</head>

<body>

  <div id="bookmark-overlay" onclick="hideBookmarkOverlay()">
    <div class="bookmark-popup">

      <div class="bookmark-content">
